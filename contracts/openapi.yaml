openapi: 3.1.0
info:
  title: 油漆门店经营管理 API — Phase 7
  version: 0.7.0
  description: Go 后端合同草案。本地 mock 使用相同响应结构；生产认证与业务持久化由 Go 实现。
servers:
  - url: http://localhost:8080/api/v1
paths:
  /auth/login:
    post:
      summary: 账号密码登录
      description: 返回短期 access token；设置 HttpOnly refresh cookie。校验 Origin，限制登录尝试；账号停用返回 403。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, password]
              properties:
                account: {type: string, minLength: 1, maxLength: 80}
                password: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/refresh:
    post:
      summary: 用 HttpOnly cookie 恢复会话
      description: 前端合并并发刷新；服务端负责 cookie 安全、刷新令牌轮换及失效。返回数据禁止缓存。
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      summary: 撤销 refresh 会话并清除 cookie
      description: 重复退出也返回 204；校验 Origin；清除 cookie 的 path/domain 必须与设置时一致。
      responses:
        '204': {description: 已退出}
        '403': {$ref: '#/components/responses/Error'}
  /auth/me:
    get:
      summary: 当前身份与权限
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: 当前有效用户
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /ledger/statement:
    get:
      summary: 生成客户往来对账单
      description: 期末应收 = 期初应收 + 用料金额 - 付款 - 预存抵扣 - 已确认退料冲减。
      security: [{bearerAuth: []}]
      parameters:
        - {name: workerId, in: query, required: true, schema: {type: string}}
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
      responses:
        '200':
          description: 客户在指定期间的往来汇总和逐笔余额
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LedgerStatement'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /dashboard/summary:
    get:
      summary: 门店经营统计
      description: 返回当前累计指标、近六月趋势、应收排行和最近业务，仅限具有 reports:read 权限的用户。
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: 工作台统计数据
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardSummary'}
        '403': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  responses:
    Session:
      description: 会话已建立或刷新；Cache-Control 为 no-store
      content:
        application/json:
          schema:
            type: object
            required: [accessToken, expiresIn, user]
            properties:
              accessToken: {type: string, minLength: 1}
              expiresIn: {type: integer, minimum: 1}
              user: {$ref: '#/components/schemas/User'}
    Error:
      description: 统一错误响应（401/403/404/409/422/429/500）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    DashboardSummary:
      type: object
      required: [generatedAt, summary, trend, topDebtors, recent]
      properties:
        generatedAt: {type: string, format: date-time}
        summary:
          type: object
          required: [materialTotal, paymentTotal, returnTotal, receivable, activeWorkers, activeProjects]
          properties:
            materialTotal: {type: string}
            paymentTotal: {type: string}
            returnTotal: {type: string}
            receivable: {type: string}
            activeWorkers: {type: integer}
            activeProjects: {type: integer}
        trend:
          type: array
          items:
            type: object
            required: [month, materialAmount, paymentAmount]
            properties:
              month: {type: string}
              materialAmount: {type: string}
              paymentAmount: {type: string}
        topDebtors:
          type: array
          items:
            type: object
            required: [workerId, workerName, teamName, receivable]
            properties:
              workerId: {type: string}
              workerName: {type: string}
              teamName: {type: [string, 'null']}
              receivable: {type: string}
        recent:
          type: array
          items:
            type: object
            required: [id, type, referenceNo, workerName, amount, occurredAt]
            properties:
              id: {type: string}
              type: {type: string, enum: [ORDER, PAYMENT, RETURN]}
              referenceNo: {type: string}
              workerName: {type: string}
              amount: {type: string}
              occurredAt: {type: string, format: date-time}
    LedgerStatement:
      type: object
      required: [worker, from, to, generatedAt, summary, entries]
      properties:
        worker:
          type: object
          required: [id, name, phone, teamName]
          properties:
            id: {type: string}
            name: {type: string}
            phone: {type: string}
            teamName: {type: [string, 'null']}
        from: {type: [string, 'null'], format: date}
        to: {type: [string, 'null'], format: date}
        generatedAt: {type: string, format: date-time}
        summary:
          type: object
          required: [openingBalance, chargeTotal, paymentTotal, prepaidTotal, returnTotal, closingBalance]
          properties:
            openingBalance: {type: string}
            chargeTotal: {type: string}
            paymentTotal: {type: string}
            prepaidTotal: {type: string}
            returnTotal: {type: string}
            closingBalance: {type: string}
        entries:
          type: array
          items:
            type: object
            required: [id, type, referenceNo, occurredAt, description, chargeAmount, paymentAmount, prepaidAmount, returnAmount, balance, operatorName]
            properties:
              id: {type: string}
              type: {type: string, enum: [ORDER, PAYMENT, RETURN]}
              referenceNo: {type: string}
              occurredAt: {type: string, format: date-time}
              description: {type: string}
              chargeAmount: {type: string}
              paymentAmount: {type: string}
              prepaidAmount: {type: string}
              returnAmount: {type: string}
              balance: {type: string}
              operatorName: {type: string}
    User:
      type: object
      required: [id, name, account, role, permissions, status]
      properties:
        id: {type: string}
        name: {type: string}
        account: {type: string}
        role: {type: string, enum: [OWNER, FINANCE, CLERK]}
        status: {type: string, enum: [ACTIVE, DISABLED]}
        permissions:
          type: array
          items:
            type: string
            enum: ['workers:read', 'workers:write', 'materials:read', 'materials:write', 'orders:create', 'returns:request', 'returns:confirm', 'returns:manual', 'finance:read', 'payments:create', 'prepaid:deposit', 'ledger:adjust', 'reconciliation:read', 'reports:read', 'system:manage']
    ApiError:
      type: object
      required: [code, message, requestId]
      properties:
        code: {type: string}
        message: {type: string}
        requestId: {type: string}
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
