services:
  frontend:
    image: claude-ledger-frontend:latest
    build:
      context: .
      args:
        NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE:-real}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?请在 .env 中配置后端 API 地址}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
